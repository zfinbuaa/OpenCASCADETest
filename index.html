<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: local:; connect-src 'self' blob: local:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';">
<title>数模自动拆装工具</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Microsoft YaHei', sans-serif; overflow: hidden; height: 100vh; }
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* Tabs */
  #tab-bar {
    display: flex; background: #0f3460; height: 34px; flex-shrink: 0;
    padding: 0 8px; align-items: flex-end;
  }
  .tab {
    padding: 6px 18px; margin-right: 2px; border-radius: 6px 6px 0 0;
    cursor: pointer; font-size: 13px; color: #8899aa; border: none;
    background: #0a1f3a; transition: all 0.15s;
  }
  .tab.active { background: #16213e; color: #7ec8e3; font-weight: 600; }
  .tab:hover:not(.active) { background: #12253d; color: #aac; }

  #main-area { display: grid; grid-template-columns: 260px 1fr 280px; flex: 1; overflow: hidden; }
  #tree-panel {
    background: #16213e; color: #e0e0e0; overflow-y: auto;
    border-right: 1px solid #1a1a4e; display: flex; flex-direction: column;
  }
  #tree-panel .section-title {
    flex-shrink: 0; border-bottom: 1px solid #1a1a4e;
  }
  #tree-container { flex: 1; overflow-y: auto; padding: 2px 0; }
  #viewport { flex: 1; position: relative; background: #ffffff; overflow: hidden; }
  #viewport canvas { display: block; }

  #panel {
    background: #16213e; color: #e0e0e0;
    display: flex; flex-direction: column; overflow: hidden;
    border-left: 1px solid #1a1a4e;
  }
  #panel-header {
    padding: 10px 16px; background: #0f3460; font-size: 15px; font-weight: 600;
    border-bottom: 1px solid #1a1a4e;
  }
  #panel-body { flex: 1; overflow-y: auto; padding: 4px 0; }
  #panel-footer { padding: 6px 12px; background: #0f3460; font-size: 10px; color: #778; }

  .section-title {
    padding: 8px 16px 3px; font-size: 11px; text-transform: uppercase;
    color: #7ec8e3; letter-spacing: 1px; font-weight: 600;
  }
  .btn {
    display: inline-block; padding: 5px 12px; margin: 2px 3px; border: none;
    border-radius: 4px; cursor: pointer; font-size: 12px; font-family: inherit;
    transition: all 0.15s;
  }
  .btn-pri { background: #1e90ff; color: #fff; }
  .btn-pri:hover { background: #3aa0ff; }
  .btn-outline { background: transparent; border: 1px solid #555; color: #ccc; }
  .btn-outline:hover { border-color: #1e90ff; color: #1e90ff; }
  .btn-group { padding: 3px 12px; display: flex; flex-wrap: wrap; gap: 3px; }

  /* Tree */
  .tree-item {
    display: flex; align-items: center; padding: 2px 10px; cursor: pointer;
    font-size: 11px; transition: background 0.1s;
  }
  .tree-item:hover { background: rgba(255,255,255,0.05); }
  .tree-item.selected { background: rgba(30,144,255,0.25); }
  .tree-item .icon { width: 14px; margin-right: 3px; flex-shrink: 0; }
  .tree-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-item .badge {
    font-size: 8px; padding: 1px 4px; border-radius: 3px; margin-left: 3px;
    background: #333; color: #aaa; flex-shrink: 0;
  }
  .tree-item .badge.stage { background: #1e90ff; color: #fff; }

  #status-bar {
    position: absolute; bottom: 6px; left: 6px; right: 6px;
    padding: 4px 8px; background: rgba(0,0,0,0.5); color: #aaa;
    font-size: 10px; border-radius: 3px; pointer-events: none;
  }

  #pipeline-log {
    margin: 4px 10px; padding: 6px; background: #0a0a1a; border-radius: 3px;
    font-family: Consolas, monospace; font-size: 9px; color: #7ec8e3;
    max-height: 120px; overflow-y: auto; display: none;
  }
  #pipeline-log.visible { display: block; }

  .slider-row { padding: 3px 14px; font-size: 11px; display: flex; align-items: center; gap: 6px; }
  .slider-row input[type=range] { flex: 1; accent-color: #1e90ff; }

  select.sel { margin: 4px 12px; padding: 4px 8px; border-radius: 3px; border: 1px solid #444;
    background: #0d1b33; color: #ccc; font-size: 12px; width: calc(100% - 24px); }

  /* Tree view */
  .tree-node { display: flex; align-items: center; padding: 2px 4px; cursor: pointer;
    font-size: 11px; transition: background 0.1s; border-radius: 2px; }
  .tree-node:hover { background: rgba(255,255,255,0.05); }
  .tree-node.selected { background: rgba(30,144,255,0.25); }
  .tree-node .arrow { width: 14px; text-align: center; flex-shrink: 0; cursor: pointer;
    user-select: none; font-size: 9px; }
  .tree-node .arrow.leaf { visibility: hidden; }
  .tree-node .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
   .tree-node .swatch { width:14px;height:14px;border-radius:3px;margin-left:6px;flex-shrink:0;
     cursor:pointer;border:1px solid #555; }
   .color-palette { position:fixed; background:#fff; border:1px solid #ccc;
     border-radius:6px; padding:8px; z-index:1000; box-shadow:0 2px 8px rgba(0,0,0,0.15);
     max-width:180px; }
   .color-preset { width:28px;height:28px;border-radius:50%;border:2px solid transparent;
     cursor:pointer; display:inline-block; box-sizing:border-box; transition:transform .1s,border-color .1s; }
   .color-preset:hover { border-color:#333; transform:scale(1.15); }
   .color-custom { display:block; cursor:pointer; font-size:12px; color:#666; margin-top:6px;
     border-top:1px solid #eee; padding-top:6px; text-align:center; }
   .color-custom:hover { color:#333; }
  .tree-children { margin-left: 0; }
  .tree-children.collapsed { display: none; }
  .tree-node .badge.fixed { background: #e67e22; color: #fff; }
  .tree-node .eye-icon { width:16px;text-align:center;flex-shrink:0;cursor:pointer;
    user-select:none;font-size:10px;color:#889;margin:0 2px; }
  .tree-node .eye-icon:hover { color:#1e90ff; }
</style>
</head>
<body>

<div id="app">
  <div id="tab-bar">
    <button class="tab active" data-tab="0">位置图</button>
    <button class="tab" data-tab="1">爆炸图</button>
    <button class="tab" data-tab="2">拆装方案</button>
  </div>

  <div id="main-area">
    <div id="tree-panel">
      <div class="section-title">结构树</div>
      <div id="tree-container"></div>
    </div>
    <div id="viewport">
      <div id="status-bar">就绪 — Ctrl+B 加载BOM | Ctrl+O 加载JSON</div>
    </div>

    <div id="panel">
      <div id="panel-header">位置图</div>
      <div id="panel-body"></div>
      <div id="pipeline-log"></div>
      <div id="panel-footer">OCCT + Three.js + Electron | v2.0</div>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
